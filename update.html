<body>

<div class="container">

    <h1>🎓 STUDENT MANAGEMENT</h1>

    <hr>

    <nav>
        <a href="index.html">Home</a> |
        <a href="list.html">List Students</a> |
        <a href="listOne.html">List Required Student</a> |
        <a href="insert.html">Insert Student</a> |
        <a href="update.html">Update Student</a> |
        <a href="delete.html">Delete Student</a>
    </nav>

    <hr>

    <div class="update-box">

        <h2>✏️ UPDATE STUDENT</h2>

        <label>Student Number</label>
        <input type="number" id="sno"
        placeholder="Enter Student Number">

        <label>Student Name</label>
        <input type="text" id="name"
        placeholder="Enter Student Name">

        <label>Total Marks</label>
        <input type="number" id="total"
        placeholder="Enter Total Marks">

        <button class="update-btn"
        onclick="updateStudent()">
            ✏️ Update Student
        </button>

        <br>

        <button class="home-btn"
        onclick="location.href='index.html'">
            🏠 Home Page
        </button>

    </div>

    <footer>
        <hr>
        <p>© 2026 Student Management System | All Rights Reserved</p>
    </footer>

</div>

<script>

function updateStudent()
{

    let sno = document.getElementById("sno").value;
    let name = document.getElementById("name").value;
    let total = document.getElementById("total").value;

    if(sno === "" || name.trim() === "" || total === "")
    {
        alert("Please fill all student details");
        return;
    }

    fetch("/students/" + sno,{
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            name:name,
            total:total
        })
    })

    .then(response=>{

        if(response.ok)
            return response.text();

        return response.text().then(message=>{
            throw new Error(message);
        });

    })

    .then(message=>{
        alert(message);
        location.href="index.html";
    })

    .catch(error=>{
        alert(error.message);
    });

}

</script>

</body>
</html>
