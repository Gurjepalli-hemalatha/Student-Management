<div class="container">

    <h1>🎓 STUDENT MANAGEMENT</h1>

    <hr>

    <nav>

        <a href="delete.html">Delete Student</a>
    </nav>

    <hr>

    <div class="delete-box">

        <h2>🗑️ DELETE STUDENT</h2>

        <label>Student Number to Delete</label>

        <input type="number" id="sno"
        placeholder="Enter Student Number">

        <br><br>

        <button class="delete-btn" onclick="deleteStudent()">
            Delete Student
        </button>

        <br>

        <button class="home-btn"
        onclick="location.href='index.html'">
            🏠 Home Page
        </button>

    </div>

    <footer>
        <hr>
        <p>© 2026 Student Management System | All Rights Reserved</p>
    </footer>

</div>

<script>

function deleteStudent()
{
    let sno = document.getElementById("sno").value;

    if(sno === "" || Number(sno) <= 0)
    {
        alert("Please enter a valid Student Number");
        return;
    }

    if(confirm("Are you sure?") == false)
        return;

    fetch("/students/"+sno,{
        method:"DELETE"
    })
    .then(response=>{
        if(response.ok)
            return response.text();

        return response.text().then(message=>{
            throw new Error(message);
        });
    })
    .then(message=>{
        alert(message);
        location.href="index.html";
    })
    .catch(error=>{
        alert(error.message);
    });
}

</script>

</body>
