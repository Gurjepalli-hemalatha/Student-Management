<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <style>
        * {
            margin: 0;

            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;

        }

        h1 {
            color: #49318c;
            font-size: 32px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        hr {
            border: none;
            height: 2px;
            background: #ddd;
            margin: 20px 0;
        }

        nav {
            margin: 20px 0;
            line-height: 2.5;
        }

        nav a {
            text-decoration: none;
            color: #5b45a0;
            font-weight: bold;
            padding: 10px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #e84393;
        }

        h2 {
            color: #333;
            margin: 25px 0;
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        button {
            width: 280px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        button:hover {
            transform: translateY(-4px);
            background: linear-gradient(90deg, #764ba2, #e84393);
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
        }

        footer {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }

        @media(max-width: 600px) {
            .container {
                padding: 20px;
            }

            nav a {
                display: inline-block;
                padding: 5px;
            }

            button {
                width: 100%;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
