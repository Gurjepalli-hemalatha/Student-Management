<!DOCTYPE html>
<html>

<head>
    <title>Insert Student</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #49318c;
            font-size: 32px;
            margin-bottom: 20px;
        }

        hr {
            border: none;
            height: 2px;
            background: #ddd;
            margin: 20px 0;
        }

        nav {
            margin: 20px 0;
            line-height: 2.5;
        }

        nav a {
            text-decoration: none;
            color: #5b45a0;
            font-weight: bold;
            padding: 8px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #e84393;
        }

        .insert-box {
            background: #f8f7ff;
            padding: 30px;
            border-radius: 15px;
            max-width: 450px;
            margin: 30px auto;
            border: 1px solid #e0d9ff;
        }

        h2 {
            color: #49318c;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #764ba2;
        }

        button {
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        .save-btn {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
        }

        .save-btn:hover {
            background: #49318c;
            transform: translateY(-3px);
        }

        .home-btn {
            background: #27ae60;
            color: white;
        }

        .home-btn:hover {
            background: #1e8449;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }

        @media(max-width: 600px) {
            .container {
                padding: 20px;
            }

            nav a {
                display: inline-block;
                padding: 5px;
            }

            h1 {
                font-size: 25px;
            }
        }

    </style>
</head>
