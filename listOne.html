        label {

            padding: 13px 25px;

<body>

<div class="container">

    <h1>🎓 STUDENT MANAGEMENT</h1>

    <hr>

    <nav>
        <a href="index.html">Home</a> |
        <a href="list.html">List Students</a> |
        <a href="listOne.html">List Required Student</a> |
        <a href="insert.html">Insert Student</a> |
        <a href="update.html">Update Student</a> |
        <a href="delete.html">Delete Student</a>
    </nav>

    <hr>

    <div class="search-box">

        <h2>🔍 SEARCH STUDENT</h2>

        <label>Student Number</label>

        <input type="number" id="sno"
        placeholder="Enter Student Number">

        <br>

        <button class="search-btn" onclick="searchStudent()">
            🔍 Search Student
        </button>

    </div>

    <h2>📋 STUDENT DETAILS</h2>

    <div class="table-box">

        <table id="studentTable">

            <tr>
                <th>Student Number</th>
                <th>Name</th>
                <th>Total Marks</th>
            </tr>

        </table>

    </div>

    <br>

    <button class="home-btn"
    onclick="location.href='index.html'">
        🏠 Home Page
    </button>

    <footer>
        <hr>
        <p>© 2026 Student Management System | All Rights Reserved</p>
    </footer>

</div>

<script>

function searchStudent()
{
    let sno = document.getElementById("sno").value;

    if(sno === "" || Number(sno) <= 0)
    {
        alert("Please enter a valid Student Number");
        return;
    }

    fetch("/students/" + sno)

    .then(response => {

        if(!response.ok)
            throw new Error("Student Not Found");

        return response.json();

    })

    .then(data => {

        if(data.length == 0)
        {
            alert("Student Not Found");
            return;
        }

        let table = document.getElementById("studentTable");

        table.innerHTML = `
            <tr>
                <th>Student Number</th>
                <th>Name</th>
                <th>Total Marks</th>
            </tr>

            <tr>
                <td>${data[0].student_id}</td>
                <td>${data[0].student_name}</td>
                <td>${data[0].total}</td>
            </tr>
        `;

    })

    .catch(error => {
        alert(error.message);
    });

}

</script>

</body>
</html>
